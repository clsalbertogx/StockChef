name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+psycopg://stockchef_app:stockchef_app@localhost:5432/test
  ALEMBIC_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test && break
            sleep 2
          done

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

  compose-smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 3
          done

      - name: Test API health
        run: |
          curl -sf http://localhost:8000/api/v1/health | jq -e '.status == "ok"'
          curl -sf http://localhost:5173 | grep -q "StockChef"

      - name: Shutdown
        run: docker compose down -v