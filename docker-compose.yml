services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockchef
      POSTGRES_PASSWORD: stockchef
      POSTGRES_DB: stockchef
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockchef -d stockchef"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://stockchef:stockchef@postgres:5432/stockchef
      ALEMBIC_DATABASE_URL: postgresql+psycopg://stockchef:stockchef@postgres:5432/stockchef
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: